name: Unit tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      # Preserve the public CESM/MITgcm module names; generated metadata is
      # reported in coverage but is not maintained lint/type-check input.
      - run: ruff check veris tests doc/conf.py setup.py versioneer.pyi --exclude veris/_version.py --ignore N999
      - run: ruff format --check veris tests doc/conf.py setup.py versioneer.pyi --exclude veris/_version.py
      - run: ruff check veris tests doc/conf.py setup.py versioneer.pyi --exclude veris/_version.py --select ANN001,ANN002,ANN003,ANN201,ANN202,ANN204,ANN205,ANN206
      - run: ty check veris tests doc/conf.py setup.py versioneer.pyi --exclude veris/_version.py
      - run: pytest tests/ --cov=veris --cov-report=xml --cov-report=term:skip-covered --cov-report=json:test_logs/coverage.json
        env:
          JAX_PLATFORMS: cpu
      - run: coverage report --omit=veris/_version.py --fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            test_logs/coverage.json
